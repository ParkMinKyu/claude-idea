<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Suspender Options</title>
    <style>
      body { font-family: system-ui; max-width: 480px; margin: 24px auto; }
      textarea { width: 100%; height: 120px; }
      label { display: block; margin: 12px 0 4px; }
    </style>
  </head>
  <body>
    <h2>Tab Suspender Options</h2>
    <label for="whitelist">Whitelist (one domain per line, * for wildcards)</label>
    <textarea id="whitelist" placeholder="mail.google.com&#10;*.slack.com"></textarea>
    <label><input id="pinned" type="checkbox" /> Exclude pinned tabs</label>
    <label><input id="audible" type="checkbox" /> Exclude audible tabs</label>
    <button id="save">Save</button>
    <p id="status"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
