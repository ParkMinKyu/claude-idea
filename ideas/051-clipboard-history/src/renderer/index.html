<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clipboard History</title>
  <style>
    body { font-family: system-ui; margin: 0; padding: 8px; background: #1e1e1e; color: #ddd; }
    #q { width: 100%; padding: 8px; background: #2b2b2b; border: 1px solid #444; color: #fff; }
    .item { padding: 6px; border-bottom: 1px solid #333; cursor: pointer; white-space: pre-wrap;
            font-family: ui-monospace, monospace; font-size: 12px; }
    .item:hover { background: #2b2b2b; }
    .pinned::before { content: "📌 "; }
  </style>
</head>
<body>
  <input id="q" placeholder="Search clipboard…" autofocus />
  <div id="results"></div>
  <script src="app.js"></script>
</body>
</html>
