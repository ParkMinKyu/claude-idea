  <h2>Window Manager</h2>
  <p>Use the following shortcuts:</p>
  <ul>
    <li>Cmd/Ctrl+Alt+Left → Left half</li>
    <li>Cmd/Ctrl+Alt+Right → Right half</li>
    <li>Cmd/Ctrl+Alt+C → Center</li>
    <li>Cmd/Ctrl+Alt+F → Fullscreen</li>
  </ul>
