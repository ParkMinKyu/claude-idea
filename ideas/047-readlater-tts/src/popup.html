<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui; width: 260px; padding: 12px; }
    button { width: 100%; margin: 4px 0; padding: 6px; }
    label { display: block; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 8px">ReadLater TTS</h3>
  <button id="play">Play this page</button>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="stop">Stop</button>
  <button id="queue">Add to Read Later</button>
  <label>Rate: <input id="rate" type="number" min="0.5" max="3" step="0.1" value="1" /></label>
  <script src="popup.js" type="module"></script>
</body>
</html>
